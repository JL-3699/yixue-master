name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      # 关键：自动生成 Web 工程外壳，注意 --base-href 参数必须加，否则会白屏
      - run: flutter create . --platforms=web --project-name yixue_master
      - run: flutter pub get
      - run: flutter build web --release --base-href "/yixue-master/"
      # 自动发布到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
